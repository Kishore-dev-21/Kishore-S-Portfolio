<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kishore S.</title>
<style>
  :root {
    --bg: #f5f5f7;
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --glow-a: rgba(120, 140, 255, .35);
    --glow-b: rgba(255, 150, 200, .28);
    --d: 1;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000; --ink: #f5f5f7; --muted: #a1a1a6;
      --glow-a: rgba(90, 110, 255, .38); --glow-b: rgba(190, 90, 255, .26);
    }
  }
  :root[data-theme="dark"] {
    --bg: #000; --ink: #f5f5f7; --muted: #a1a1a6;
    --glow-a: rgba(90, 110, 255, .38); --glow-b: rgba(190, 90, 255, .26);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ================= SPLASH (intro screen) ================= */
  .splash {
    position: fixed; inset: 0; z-index: 9999;
    display: grid; place-items: center;
    background: var(--bg);
    overflow: hidden;
    cursor: pointer;
    transition: opacity .9s ease, transform .9s cubic-bezier(.4,0,.2,1), filter .9s ease, visibility 0s linear .9s;
  }
  .splash.leave { opacity: 0; transform: scale(1.04); filter: blur(8px); visibility: hidden; pointer-events: none; }

  .glow {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(42vmax 30vmax at 38% 46%, var(--glow-a), transparent 70%),
      radial-gradient(38vmax 28vmax at 64% 56%, var(--glow-b), transparent 70%);
    opacity: 0;
    animation: glow-in 2.4s ease-out .2s forwards, breathe 14s ease-in-out 2.6s infinite alternate;
  }
  @keyframes glow-in { to { opacity: 1; } }
  @keyframes breathe { from { transform: scale(1); } to { transform: scale(1.08) translateY(-1.5%); } }

  .hero {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    width: min(86vw, 640px);
    text-align: center;
  }
  svg { display: block; width: 100%; height: auto; overflow: visible; }

  .stroke {
    fill: none; stroke: var(--ink); stroke-width: 14.8883; stroke-linecap: round;
    stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0;
  }
  .play #p1 { animation: draw calc(.8s * var(--d)) ease-in-out forwards, show .4s ease-in-out forwards; }
  .play #p2 { animation: draw calc(2.8s * var(--d)) ease-in-out calc(.7s * var(--d)) forwards, show .7s ease-in-out calc(.7s * var(--d)) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes show { to { opacity: 1; } }

  .intro { margin-top: clamp(28px, 6vh, 56px); }
  .rise { opacity: 0; transform: translateY(14px); }
  .play .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
  .play .r1 { animation-delay: 3.5s; }
  .play .r2 { animation-delay: 3.8s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  h1 {
    margin: 0;
    font-size: clamp(2rem, 6vw, 3.4rem);
    font-weight: 600;
    letter-spacing: -.025em;
    line-height: 1.08;
  }
  .role {
    margin: .75rem auto 0;
    max-width: 40ch;
    font-size: clamp(1rem, 2.4vw, 1.2rem);
    line-height: 1.45;
    color: var(--muted);
  }

  /* ================= YOUR SITE (placeholder) ================= */
  .site {
    min-height: 100vh; min-height: 100svh;
    display: grid; place-items: center;
    text-align: center; padding: 24px;
    box-sizing: border-box;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    .glow { animation: glow-in .01s forwards; }
    .play #p1, .play #p2 { animation-duration: .01s, .01s; animation-delay: 0s; }
    .play .rise { animation-duration: .01s; animation-delay: 0s; }
    .splash { transition-duration: .01s; }
  }
</style>
</head>
<body>

  <div class="splash" id="splash" role="img" aria-label="Hello, I'm Kishore S.">
    <div class="glow" aria-hidden="true"></div>
    <div class="hero">
      <svg viewBox="0 0 638 200" aria-hidden="true">
        <path id="p1" class="stroke" pathLength="1" d="M8.69214 166.553C36.2393 151.239 61.3409 131.548 89.8191 98.0295C109.203 75.1488 119.625 49.0228 120.122 31.0026C120.37 17.6036 113.836 7.43883 101.759 7.43883C88.3598 7.43883 79.9231 17.6036 74.7122 40.9363C69.005 66.5793 64.7866 96.0036 54.1166 190.356"/>
        <path id="p2" class="stroke" pathLength="1" d="M55.1624 181.135C60.6251 133.114 81.4118 98.0479 107.963 98.0479C123.844 98.0479 133.937 110.703 131.071 128.817C129.457 139.487 127.587 150.405 125.408 163.06C122.869 178.941 130.128 191.348 152.122 191.348C184.197 191.348 219.189 173.523 237.097 145.915C243.198 136.509 245.68 128.073 245.928 119.884C246.176 104.996 237.739 93.8296 222.851 93.8296C203.992 93.8296 189.6 115.17 189.6 142.465C189.6 171.745 205.481 192.341 239.208 192.341C285.066 192.341 335.86 137.292 359.199 75.8585C365.788 58.513 368.26 42.4065 368.26 31.1512C368.26 17.8057 364.042 7.55823 352.131 7.55823C340.469 7.55823 332.777 16.6141 325.829 30.9129C317.688 47.4967 311.667 71.4162 309.203 98.4549C303 166.301 316.896 191.348 349.936 191.348C390 191.348 434.542 135.534 457.286 75.6686C463.803 58.513 466.275 42.4065 466.275 31.1512C466.275 17.8057 462.057 7.55823 450.146 7.55823C438.484 7.55823 430.792 16.6141 423.844 30.9129C415.703 47.4967 409.682 71.4162 407.218 98.4549C401.015 166.301 414.911 191.348 444.416 191.348C473.874 191.348 489.877 165.67 499.471 138.402C508.955 111.447 520.618 94.8221 544.935 94.8221C565.035 94.8221 580.916 109.71 580.916 137.75C580.916 168.768 560.792 192.093 535.362 192.341C512.984 192.589 498.285 174.475 499.774 147.179C501.511 116.907 519.873 94.8221 543.943 94.8221C557.839 94.8221 569.51 100.999 578.682 107.725C603.549 125.866 622.709 114.656 630.047 96.7186"/>
      </svg>
      <div class="intro">
        <h1 class="rise r1">I'm Kishore S.</h1>
        <p class="role rise r2">Third-year IT student at Sri Sairam Engineering College. I build web apps and AI systems that solve real problems.</p>
      </div>
    </div>
  </div>

  <!-- Replace this block with your real website -->
  <main class="site" id="site">
    <p>Your website starts here.</p>
  </main>

<script>
  (function () {
    /* ---- settings ---- */
    var SHOW_FOR_MS = 7000;      // how long the intro stays before it exits
    var SITE_URL    = "";        // optional: e.g. "home.html". Leave empty to just reveal the page below.

    var splash = document.getElementById('splash');
    var done = false;

    function enter() {
      if (done) return;
      done = true;
      splash.classList.add('leave');
      document.documentElement.style.overflow = '';
      if (SITE_URL) setTimeout(function () { location.href = SITE_URL; }, 700);
      else setTimeout(function () { splash.remove(); }, 1000);
    }

    document.documentElement.style.overflow = 'hidden'; // no scrolling during the intro
    window.addEventListener('load', function () {
      setTimeout(function () { document.body.classList.add('play'); }, 300);
      setTimeout(enter, SHOW_FOR_MS);
    });
    splash.addEventListener('click', enter);                      // tap to skip
    document.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === 'Escape') enter(); });
  })();
</script>
</body>
</html>
